<!-- Emergency Kill-Switch Confirmation Modal -->
<div id="kill-switch-modal" class="modal-overlay">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <div style="font-size:18px; font-weight:800; color:var(--rose); display:flex; align-items:center; gap:8px;">
                <span>⚠️</span> Emergency Portfolio Flatten
            </div>
            <button onclick="closeKillSwitchModal()" style="background:transparent; border:none; color:var(--text-muted); font-size:18px; cursor:pointer;">✕</button>
        </div>

        <p style="font-size:13px; color:var(--text-muted); line-height:1.5; margin-bottom:16px;">
            This will immediately send <strong style="color:var(--rose);">emergency MARKET exit orders</strong> to close all open positions across 
            <strong>Intraday (MIS)</strong>, <strong>Swing (CNC)</strong>, and <strong>F&O Spreads</strong>. Pending AMOs will be purged.
        </p>

        <div style="margin-bottom:16px;">
            <label style="font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; display:block; margin-bottom:6px;">Operator Reason:</label>
            <input type="text" id="kill-switch-reason" value="Operator Manual Flatten" style="width:100%; background:var(--bg-base); border:1px solid var(--border); border-radius:6px; padding:8px 12px; color:var(--text-main); font-family:var(--font-sans); font-size:13px;">
        </div>

        <div style="display:flex; justify-content:flex-end; gap:10px;">
            <button onclick="closeKillSwitchModal()" style="background:var(--bg-card); border:1px solid var(--border); color:var(--text-main); padding:8px 16px; border-radius:6px; font-weight:600; font-size:13px; cursor:pointer;">
                Cancel
            </button>
            <button id="btn-confirm-kill-switch" onclick="executeKillSwitch()" style="background:var(--rose); border:none; color:#fff; padding:8px 16px; border-radius:6px; font-weight:700; font-size:13px; cursor:pointer;">
                Confirm & Flatten All
            </button>
        </div>
    </div>
</div>
